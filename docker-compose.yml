version: '3.8'

services:
  # Base de datos PostgreSQL (para desarrollo local)
  postgres:
    image: postgres:15-alpine
    container_name: tp8-postgres
    environment:
      POSTGRES_DB: final_clj4
      POSTGRES_USER: admin
      POSTGRES_PASSWORD: ""
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U admin"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Backend (Go)
  backend:
    build:
      context: ./final/backend
      dockerfile: Dockerfile
    container_name: tp8-backend
    ports:
      - "8080:8080"
    environment:
      PORT: 8080
      DB_HOST: postgres
      DB_PORT: 5432
      DB_USER: admin
      DB_PASSWORD: ""
      DB_NAME: final_clj4
      DB_SSLMODE: disable
    depends_on:
      postgres:
        condition: service_healthy
    volumes:
      - ./final/backend/uploads:/app/uploads

  # Frontend (Next.js)
  frontend:
    build:
      context: ./final/frontend
      dockerfile: Dockerfile
      args:
        NEXT_PUBLIC_API_URL: http://localhost:8080
    container_name: tp8-frontend
    ports:
      - "3000:8080"
    environment:
      PORT: 8080
      NEXT_PUBLIC_API_URL: http://localhost:8080
    depends_on:
      - backend

volumes:
  postgres_data:

