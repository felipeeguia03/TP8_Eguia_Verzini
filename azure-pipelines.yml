                      ORYX_NPM_INSTALL_OPTIONS="--no-audit --no-fund"
                    az webapp config set -g $(rg) -n $(feProdApp) --startup-file ""
                    az webapp config appsettings delete -g $(rg) -n $(feProdApp) --setting-names WEBSITE_RUN_FROM_PACKAGE || true

              - task: AzureWebApp@1
