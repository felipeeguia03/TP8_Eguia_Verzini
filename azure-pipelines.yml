trigger:
  branches:
    include:
      - main
      - master

# Build en tu agente self-hosted
pool:
  name: SelfHosted

variables:
  rg: "rg-tp05-ingsoft3-2025"
  azureServiceConnection: "azure-tp05-connection"

  # Container Registry
  acrName: "acrtp05verzinieguia" # Cambiar por tu ACR
  acrLoginServer: "$(acrName).azurecr.io"

  # Web Apps
  beQaApp: "webapp-tp05-back-QA-verzini-eguia"
  beProdApp: "webapp-tp05-back-PROD-verzini-eguia"
  feQaApp: "webapp-tp05-front-QA-verzini-eguia"
  feProdApp: "webapp-tp05-front-PROD-verzini-eguia"

  # Imágenes Docker
  backendImage: "backend"
  frontendImage: "frontend"

  # MySQL QA
  qaMysqlHost: "mysql-tp05-qa-verzini-eguia.mysql.database.azure.com"
  qaMysqlUser: "qa_user"
  qaMysqlPass: "Qa#2025!strong"
  qaMysqlDb: "cursos_qa"

  # MySQL PROD
  prodMysqlHost: "mysql-tp05-prod-verzini-eguia.mysql.database.azure.com"
  prodMysqlUser: "prod_user"
  prodMysqlPass: "Prod#2025!strong"
  prodMysqlDb: "cursos_prod"

  # URLs Frontend (para NEXT_PUBLIC_API_URL)
  feQaUrl: "https://webapp-tp05-front-qa-verzini-eguia-b6h9asc9g5axc6hz.chilecentral-01.azurewebsites.net"
  feProdUrl: "https://webapp-tp05-front-prod-verzini-eguia-cjdkf2dac9g3g2as.chilecentral-01.azurewebsites.net"

stages:
  # ===================== BUILD =====================
  - stage: Build
    displayName: "CI - Test & Build Docker Images"
    jobs:
      # --------- FRONTEND ---------
      - job: Build_Front
        displayName: "Test + Build Frontend Docker Image"
        steps:
          - checkout: self

          - task: NodeTool@0
            displayName: "Use Node 20.x"
            inputs:
              versionSpec: "20.x"

          - script: |
              set -e
              cd final/frontend
              npm ci
              npm test
            displayName: "npm ci + test (front)"

          - task: Docker@2
            displayName: "Build Frontend Docker Image"
            inputs:
              command: build
              repository: "$(frontendImage)"
              dockerfile: "final/frontend/Dockerfile"
              containerRegistry: "$(azureServiceConnection)"
              tags: |
                $(Build.BuildId)
                latest
              arguments: "--build-arg NEXT_PUBLIC_API_URL=$(feQaUrl)"

          - task: Docker@2
            displayName: "Push Frontend Image to ACR"
            inputs:
              command: push
              repository: "$(frontendImage)"
              containerRegistry: "$(azureServiceConnection)"
              tags: |
                $(Build.BuildId)
                latest

      # --------- BACKEND ---------
      - job: Build_Back
        displayName: "Test + Build Backend Docker Image"
        dependsOn: Build_Front
        steps:
          - checkout: self

          - task: GoTool@0
            inputs:
              version: "1.22.5"

          - script: |
              set -e
              cd final/backend
              go mod download
              go test ./... -v
            displayName: "go test (back)"

          - task: Docker@2
            displayName: "Build Backend Docker Image"
            inputs:
              command: build
              repository: "$(backendImage)"
              dockerfile: "final/backend/Dockerfile"
              containerRegistry: "$(azureServiceConnection)"
              tags: |
                $(Build.BuildId)
                latest

          - task: Docker@2
            displayName: "Push Backend Image to ACR"
            inputs:
              command: push
              repository: "$(backendImage)"
              containerRegistry: "$(azureServiceConnection)"
              tags: |
                $(Build.BuildId)
                latest

  # ===================== DEPLOY QA =====================
  - stage: Deploy_QA
    displayName: "CD - Deploy QA (Back + Front) + Healthchecks"
    dependsOn: Build
    pool:
      vmImage: "ubuntu-latest"
    jobs:
      - deployment: Deploy_QA
        environment: "QA"
        strategy:
          runOnce:
            deploy:
              steps:
                # ------ BACKEND QA ------
                - task: AzureCLI@2
                  displayName: "Configure Backend Container (QA)"
                  inputs:
                    azureSubscription: "$(azureServiceConnection)"
                    scriptType: bash
                    scriptLocation: inlineScript
                    inlineScript: |
                      set -e
                      # Configurar App Service para usar contenedor Docker
                      az webapp config container set \
                        -g $(rg) \
                        -n $(beQaApp) \
                        --docker-custom-image-name $(acrLoginServer)/$(backendImage):$(Build.BuildId) \
                        --docker-registry-server-url https://$(acrLoginServer)

                      # Configurar variables de entorno
                      az webapp config appsettings set -g $(rg) -n $(beQaApp) --settings \
                        PORT=8080 \
                        WEBSITES_PORT=8080 \
                        MYSQL_HOST="$(qaMysqlHost)" \
                        MYSQL_USER="$(qaMysqlUser)" \
                        MYSQL_PASSWORD="$(qaMysqlPass)" \
                        MYSQL_DB="$(qaMysqlDb)" \
                        MYSQL_SSL="true"

                      # Reiniciar para aplicar cambios
                      az webapp restart -g $(rg) -n $(beQaApp)

                - task: AzureCLI@2
                  displayName: "Health check BACKEND QA"
                  inputs:
                    azureSubscription: "$(azureServiceConnection)"
                    scriptType: bash
                    scriptLocation: inlineScript
                    inlineScript: |
                      set -e
                      HOST=$(az webapp show -g $(rg) -n $(beQaApp) --query defaultHostName -o tsv)
                      echo "Host QA (BACK): $HOST"
                      curl -fsS --retry 10 --retry-delay 5 "https://$HOST/healthz"
                      echo "Backend QA OK"

                # ------ FRONTEND QA ------
                - task: AzureCLI@2
                  displayName: "Configure Frontend Container (QA)"
                  inputs:
                    azureSubscription: "$(azureServiceConnection)"
                    scriptType: bash
                    scriptLocation: inlineScript
                    inlineScript: |
                      set -e
                      # Obtener URL del backend QA
                      BE_HOST=$(az webapp show -g $(rg) -n $(beQaApp) --query defaultHostName -o tsv)
                      BE_URL="https://$BE_HOST"

                      # Configurar App Service para usar contenedor Docker
                      az webapp config container set \
                        -g $(rg) \
                        -n $(feQaApp) \
                        --docker-custom-image-name $(acrLoginServer)/$(frontendImage):$(Build.BuildId) \
                        --docker-registry-server-url https://$(acrLoginServer)

                      # Configurar variables de entorno
                      az webapp config appsettings set -g $(rg) -n $(feQaApp) --settings \
                        PORT=8080 \
                        WEBSITES_PORT=8080 \
                        NEXT_PUBLIC_API_URL="$BE_URL"

                      # Reiniciar para aplicar cambios
                      az webapp restart -g $(rg) -n $(feQaApp)

                - task: AzureCLI@2
                  displayName: "Health check FRONTEND QA"
                  inputs:
                    azureSubscription: "$(azureServiceConnection)"
                    scriptType: bash
                    scriptLocation: inlineScript
                    inlineScript: |
                      set -e
                      HOST=$(az webapp show -g $(rg) -n $(feQaApp) --query defaultHostName -o tsv)
                      echo "Host FE QA: $HOST"
                      for i in $(seq 1 60); do
                        code=$(curl -sSI "https://$HOST" | head -n1 | awk '{print $2}')
                        echo "Intento $i → HTTP $code"
                        if [ "$code" -ge 200 ] && [ "$code" -lt 400 ]; then exit 0; fi
                        sleep 6
                      done
                      echo "Frontend QA no respondió 2xx/3xx a tiempo"
                      exit 1

  # ===================== DEPLOY PROD =====================
  - stage: Deploy_PROD
    displayName: "CD - Deploy PROD (con aprobación) + Healthchecks"
    dependsOn: Deploy_QA
    pool:
      vmImage: "ubuntu-latest"
    jobs:
      - deployment: Deploy_PROD
        environment: "PROD"
        strategy:
          runOnce:
            deploy:
              steps:
                # ------ BACKEND PROD ------
                - task: AzureCLI@2
                  displayName: "Configure Backend Container (PROD)"
                  inputs:
                    azureSubscription: "$(azureServiceConnection)"
                    scriptType: bash
                    scriptLocation: inlineScript
                    inlineScript: |
                      set -e
                      # Configurar App Service para usar contenedor Docker
                      az webapp config container set \
                        -g $(rg) \
                        -n $(beProdApp) \
                        --docker-custom-image-name $(acrLoginServer)/$(backendImage):$(Build.BuildId) \
                        --docker-registry-server-url https://$(acrLoginServer)

                      # Configurar variables de entorno
                      az webapp config appsettings set -g $(rg) -n $(beProdApp) --settings \
                        PORT=8080 \
                        WEBSITES_PORT=8080 \
                        MYSQL_HOST="$(prodMysqlHost)" \
                        MYSQL_USER="$(prodMysqlUser)" \
                        MYSQL_PASSWORD="$(prodMysqlPass)" \
                        MYSQL_DB="$(prodMysqlDb)" \
                        MYSQL_SSL="true"

                      # Reiniciar para aplicar cambios
                      az webapp restart -g $(rg) -n $(beProdApp)

                - task: AzureCLI@2
                  displayName: "Health check BACKEND PROD"
                  inputs:
                    azureSubscription: "$(azureServiceConnection)"
                    scriptType: bash
                    scriptLocation: inlineScript
                    inlineScript: |
                      set -e
                      HOST=$(az webapp show -g $(rg) -n $(beProdApp) --query defaultHostName -o tsv)
                      echo "Host PROD (BACK): $HOST"
                      curl -fsS --retry 10 --retry-delay 5 "https://$HOST/healthz"
                      echo "Backend PROD OK"

                # ------ FRONTEND PROD ------
                - task: AzureCLI@2
                  displayName: "Configure Frontend Container (PROD)"
                  inputs:
                    azureSubscription: "$(azureServiceConnection)"
                    scriptType: bash
                    scriptLocation: inlineScript
                    inlineScript: |
                      set -e
                      # Obtener URL del backend PROD
                      BE_HOST=$(az webapp show -g $(rg) -n $(beProdApp) --query defaultHostName -o tsv)
                      BE_URL="https://$BE_HOST"

                      # Configurar App Service para usar contenedor Docker
                      az webapp config container set \
                        -g $(rg) \
                        -n $(feProdApp) \
                        --docker-custom-image-name $(acrLoginServer)/$(frontendImage):$(Build.BuildId) \
                        --docker-registry-server-url https://$(acrLoginServer)

                      # Configurar variables de entorno
                      az webapp config appsettings set -g $(rg) -n $(feProdApp) --settings \
                        PORT=8080 \
                        WEBSITES_PORT=8080 \
                        NEXT_PUBLIC_API_URL="$BE_URL"

                      # Reiniciar para aplicar cambios
                      az webapp restart -g $(rg) -n $(feProdApp)

                - task: AzureCLI@2
                  displayName: "Health check FRONTEND PROD"
                  inputs:
                    azureSubscription: "$(azureServiceConnection)"
                    scriptType: bash
                    scriptLocation: inlineScript
                    inlineScript: |
                      set -e
                      HOST=$(az webapp show -g $(rg) -n $(feProdApp) --query defaultHostName -o tsv)
                      echo "Host FE PROD: $HOST"
                      for i in $(seq 1 60); do
                        code=$(curl -sSI "https://$HOST" | head -n1 | awk '{print $2}')
                        echo "Intento $i → HTTP $code"
                        if [ "$code" -ge 200 ] && [ "$code" -lt 400 ]; then exit 0; fi
                        sleep 6
                      done
                      echo "Frontend PROD no respondió 2xx/3xx a tiempo"
                      exit 1
