                    echo "Host FE PROD: $HOST"
                    for i in $(seq 1 60); do
                      code=$(curl -sSI "https://$HOST" | head -n1 | awk '{print $2}')
                      echo "Intento $i → HTTP $code"
                      if [ "$code" -ge 200 ] && [ "$code" -lt 400 ]; then exit 0; fi
